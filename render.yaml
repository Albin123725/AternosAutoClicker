services:
  - type: web
    name: aternos-24-7-keeper
    env: python
    plan: free
    region: oregon
    branch: main
    # ⬇️ UPDATED BUILD COMMAND WITH CHROME INSTALLATION ⬇️
    buildCommand: |
      apt-get update
      apt-get install -y wget gnupg
      wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
      echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
      apt-get update
      apt-get install -y google-chrome-stable
      pip install -r requirements.txt
    # ⬇️ START COMMAND ⬇️
    startCommand: python run.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: ATERNOS_USERNAME
        value: "_CRAFTEEE_"
      - key: ATERNOS_PASSWORD
        value: "Albin4242"
      - key: ATERNOS_SERVER
        value: "gameplannet.aternos.me:43658"
      - key: STEALTH_MODE
        value: "false"  # Disable stealth for now to simplify
    healthCheckPath: /health
